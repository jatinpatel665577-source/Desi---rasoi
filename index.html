<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Desi Rasoi - Indian Recipes</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f7f5ef;
  color: #242424;
}

.app {
  max-width: 650px;
  margin: auto;
  min-height: 100vh;
}

/* HEADER */
.header {
  background: linear-gradient(135deg, #d94801, #f07818);
  color: white;
  padding: 24px 20px 30px;
  border-radius: 0 0 28px 28px;
}

.logo {
  font-size: 25px;
  font-weight: 800;
}

.tagline {
  margin-top: 7px;
  opacity: .9;
  font-size: 14px;
}

/* SEARCH */
.search-box {
  margin-top: 22px;
  display: flex;
  background: white;
  border-radius: 15px;
  overflow: hidden;
}

.search-box input {
  flex: 1;
  border: none;
  outline: none;
  padding: 16px;
  font-size: 15px;
}

.search-box button {
  border: none;
  background: white;
  font-size: 20px;
  padding: 0 15px;
}

/* MAIN */
.main {
  padding: 25px 18px;
}

.section-title {
  font-size: 22px;
  margin-bottom: 15px;
}

/* CATEGORIES */
.categories {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 8px;
  margin-bottom: 28px;
}

.category {
  flex-shrink: 0;
  border: none;
  background: white;
  padding: 11px 16px;
  border-radius: 30px;
  cursor: pointer;
  font-weight: 600;
  box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

.category.active {
  background: #d94801;
  color: white;
}

/* RECIPE GRID */
.recipe-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.recipe-card {
  background: white;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 5px 18px rgba(0,0,0,.08);
  cursor: pointer;
  transition: .2s;
}

.recipe-card:active {
  transform: scale(.97);
}

.recipe-image {
  height: 135px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 58px;
  background: #fff1df;
}

.recipe-info {
  padding: 13px;
}

.recipe-name {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 8px;
}

.recipe-meta {
  font-size: 12px;
  color: #777;
}

/* EMPTY */
.empty {
  text-align: center;
  padding: 40px 10px;
  color: #777;
  display: none;
}

/* RECIPE DETAIL */
.detail {
  display: none;
  background: white;
  min-height: 100vh;
  padding-bottom: 30px;
}

.detail-top {
  background: linear-gradient(135deg, #d94801, #f07818);
  color: white;
  padding: 25px 20px;
  border-radius: 0 0 28px 28px;
}

.back {
  background: rgba(255,255,255,.2);
  border: none;
  color: white;
  padding: 9px 14px;
  border-radius: 10px;
  cursor: pointer;
  margin-bottom: 20px;
}

.detail-emoji {
  font-size: 75px;
  margin-bottom: 10px;
}

.detail-title {
  font-size: 28px;
}

.detail-content {
  padding: 24px 20px;
}

.info-row {
  display: flex;
  gap: 10px;
  margin-bottom: 25px;
}

.info-box {
  flex: 1;
  background: #f7f5ef;
  padding: 13px 8px;
  text-align: center;
  border-radius: 12px;
  font-size: 13px;
}

.detail-content h2 {
  font-size: 20px;
  margin: 20px 0 12px;
}

.ingredients {
  background: #fff7ed;
  padding: 17px;
  border-radius: 14px;
  line-height: 1.9;
}

.steps {
  list-style: none;
  counter-reset: step;
}

.steps li {
  counter-increment: step;
  margin-bottom: 15px;
  padding: 15px 15px 15px 48px;
  background: #f7f5ef;
  border-radius: 13px;
  position: relative;
  line-height: 1.5;
}

.steps li::before {
  content: counter(step);
  position: absolute;
  left: 13px;
  top: 13px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #d94801;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

/* DESKTOP */
@media (min-width: 650px) {
  .recipe-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HOME -->
  <div id="home">

    <header class="header">
      <div class="logo">🍛 Desi Rasoi</div>

      <div class="tagline">
        Discover delicious Indian recipes from ingredients you have.
      </div>

      <div class="search-box">
        <input
          id="search"
          type="text"
          placeholder="Search recipes...">
        <button>🔍</button>
      </div>
    </header>

    <main class="main">

      <h2 class="section-title">Explore Categories</h2>

      <div class="categories">
        <button class="category active" data-category="All">
          🍽️ All
        </button>

        <button class="category" data-category="Sabzi">
          🥔 Sabzi
        </button>

        <button class="category" data-category="Dal">
          🍲 Dal
        </button>

        <button class="category" data-category="Rice">
          🍚 Rice
        </button>

        <button class="category" data-category="Paneer">
          🧀 Paneer
        </button>

        <button class="category" data-category="Breakfast">
          🫓 Breakfast
        </button>

        <button class="category" data-category="Snacks">
          🌶️ Snacks
        </button>
      </div>

      <h2 class="section-title">Popular Indian Recipes</h2>

      <div id="recipeGrid" class="recipe-grid"></div>

      <div id="empty" class="empty">
        😕<br><br>
        No recipe found.
      </div>

    </main>

  </div>


  <!-- RECIPE DETAIL -->

  <div id="detail" class="detail">

    <div class="detail-top">

      <button class="back" onclick="showHome()">
        ← Back to recipes
      </button>

      <div id="detailEmoji" class="detail-emoji"></div>

      <h1 id="detailTitle" class="detail-title"></h1>

    </div>

    <div class="detail-content">

      <div class="info-row">

        <div class="info-box">
          ⏱️<br>
          <span id="detailTime"></span>
        </div>

        <div class="info-box">
          👨‍🍳<br>
          <span id="detailDifficulty"></span>
        </div>

        <div class="info-box">
          👥<br>
          <span id="detailServings"></span>
        </div>

      </div>

      <h2>🛒 Ingredients</h2>

      <div id="detailIngredients" class="ingredients"></div>

      <h2>👨‍🍳 How to Make</h2>

      <ol id="detailSteps" class="steps"></ol>

    </div>

  </div>

</div>


<script>

/* =========================
   RECIPE DATABASE
========================= */

const recipes = [

  {
    name: "Aloo Tamatar Sabzi",
    category: "Sabzi",
    emoji: "🥔",
    time: "30 min",
    difficulty: "Easy",
    servings: "3",
    ingredients: [
      "4 potatoes",
      "2 tomatoes",
      "1 onion",
      "2 tbsp oil",
      "1/2 tsp cumin",
      "1/2 tsp turmeric",
      "1/2 tsp red chilli powder",
      "Salt to taste",
      "Fresh coriander"
    ],
    steps: [
      "Wash and peel the potatoes. Cut them into small pieces.",
      "Heat oil in a pan and add cumin seeds.",
      "Add chopped onion and cook until lightly golden.",
      "Add chopped tomatoes, turmeric, chilli powder and salt.",
      "Cook the masala until the tomatoes become soft.",
      "Add potatoes and mix everything well.",
      "Add a little water, cover the pan and cook until potatoes become soft.",
      "Garnish with fresh coriander and serve hot."
    ]
  },

  {
    name: "Dal Tadka",
    category: "Dal",
    emoji: "🍲",
    time: "35 min",
    difficulty: "Easy",
    servings: "4",
    ingredients: [
      "1 cup yellow dal",
      "1 tomato",
      "1 onion",
      "2 tbsp oil or ghee",
      "1/2 tsp cumin",
      "2 garlic cloves",
      "1/2 tsp turmeric",
      "Salt to taste"
    ],
    steps: [
      "Wash the dal thoroughly.",
      "Cook the dal with turmeric, salt and water until soft.",
      "Heat ghee or oil in another pan.",
      "Add cumin and chopped garlic.",
      "Add onion and cook until golden.",
      "Add chopped tomato and cook until soft.",
      "Pour the tadka over the cooked dal.",
      "Mix well and serve hot."
    ]
  },

  {
    name: "Jeera Rice",
    category: "Rice",
    emoji: "🍚",
    time: "25 min",
    difficulty: "Easy",
    servings: "3",
    ingredients: [
      "1 cup basmati rice",
      "2 tbsp ghee",
      "1 tsp cumin",
      "2 cups water",
      "Salt to taste"
    ],
    steps: [
      "Wash the rice until the water becomes mostly clear.",
      "Soak rice for about 15 minutes.",
      "Heat ghee in a pan.",
      "Add cumin seeds and let them crackle.",
      "Add drained rice and gently stir.",
      "Add water and salt.",
      "Cover and cook until the rice is tender.",
      "Fluff gently with a fork and serve."
    ]
  },

  {
    name: "Paneer Masala",
    category: "Paneer",
    emoji: "🧀",
    time: "35 min",
    difficulty: "Medium",
    servings: "3",
    ingredients: [
      "250 g paneer",
      "2 tomatoes",
      "1 onion",
      "2 tbsp oil",
      "1/2 tsp cumin",
      "1/2 tsp turmeric",
      "1 tsp chilli powder",
      "1 tsp garam masala",
      "Salt to taste"
    ],
    steps: [
      "Cut paneer into small cubes.",
      "Heat oil and lightly fry the paneer.",
      "In the same pan add cumin and chopped onion.",
      "Cook the onion until golden.",
      "Add tomatoes and spices.",
      "Cook until the oil starts separating from the masala.",
      "Add paneer and a little water.",
      "Cook for 5 to 7 minutes and serve."
    ]
  },

  {
    name: "Poha",
    category: "Breakfast",
    emoji: "🥣",
    time: "15 min",
    difficulty: "Easy",
    servings: "2",
    ingredients: [
      "2 cups poha",
      "1 onion",
      "1 green chilli",
      "1/2 tsp mustard seeds",
      "1/2 tsp turmeric",
      "2 tbsp oil",
      "Salt to taste",
      "Fresh coriander"
    ],
    steps: [
      "Wash poha gently and drain the water.",
      "Heat oil in a pan.",
      "Add mustard seeds and let them crackle.",
      "Add onion and green chilli.",
      "Cook until the onion becomes soft.",
      "Add turmeric and salt.",
      "Add poha and mix gently.",
      "Cook for a few minutes and garnish with coriander."
    ]
  },

  {
    name: "Aloo Paratha",
    category: "Breakfast",
    emoji: "🫓",
    time: "35 min",
    difficulty: "Medium",
    servings: "3",
    ingredients: [
      "2 cups wheat flour",
      "3 boiled potatoes",
      "1 green chilli",
      "1/2 tsp chilli powder",
      "1/2 tsp garam masala",
      "Salt to taste",
      "Oil or ghee"
    ],
    steps: [
      "Prepare a soft dough using wheat flour and water.",
      "Mash the boiled potatoes.",
      "Mix potatoes with chilli, spices and salt.",
      "Take a portion of dough and roll it slightly.",
      "Place potato filling in the centre.",
      "Close the dough and roll it into a paratha.",
      "Cook on a hot tawa using ghee or oil.",
      "Cook both sides until golden spots appear."
    ]
  },

  {
    name: "Samosa",
    category: "Snacks",
    emoji: "🥟",
    time: "50 min",
    difficulty: "Medium",
    servings: "4",
    ingredients: [
      "2 cups maida",
      "3 potatoes",
      "1/2 cup peas",
      "1 tsp cumin",
      "1/2 tsp chilli powder",
      "1/2 tsp garam masala",
      "Salt to taste",
      "Oil"
    ],
    steps: [
      "Make a firm dough using maida, salt and water.",
      "Boil and mash the potatoes.",
      "Cook potatoes with peas and spices.",
      "Roll a small portion of dough into a circle.",
      "Cut it into two halves.",
      "Make a cone and fill it with potato mixture.",
      "Seal the edges properly.",
      "Deep fry on medium heat until golden and crisp."
    ]
  },

  {
    name: "Chole Masala",
    category: "Sabzi",
    emoji: "🍛",
    time: "45 min",
    difficulty: "Medium",
    servings: "4",
    ingredients: [
      "2 cups boiled chickpeas",
      "2 tomatoes",
      "1 onion",
      "2 tbsp oil",
      "1 tsp cumin",
      "1 tsp coriander powder",
      "1/2 tsp chilli powder",
      "1/2 tsp turmeric",
      "1 tsp garam masala",
      "Salt to taste"
    ],
    steps: [
      "Heat oil in a pan and add cumin.",
      "Add chopped onion and cook until golden.",
      "Add tomatoes and all powdered spices.",
      "Cook until the masala becomes thick.",
      "Add boiled chickpeas.",
      "Add some water and mix well.",
      "Cover and simmer for 10 to 15 minutes.",
      "Add garam masala and serve hot."
    ]
  }

];


/* =========================
   SHOW RECIPES
========================= */

const recipeGrid = document.getElementById("recipeGrid");
const empty = document.getElementById("empty");

function displayRecipes(list) {

  recipeGrid.innerHTML = "";

  if (list.length === 0) {
    empty.style.display = "block";
    return;
  }

  empty.style.display = "none";

  list.forEach((recipe, index) => {

    const card = document.createElement("div");

    card.className = "recipe-card";

    card.innerHTML = `
      <div class="recipe-image">
        ${recipe.emoji}
      </div>

      <div class="recipe-info">

        <div class="recipe-name">
          ${recipe.name}
        </div>

        <div class="recipe-meta">
          ⏱️ ${recipe.time}
          &nbsp; • &nbsp;
          ${recipe.difficulty}
        </div>

      </div>
    `;

    card.onclick = function() {
      openRecipe(index);
    };

    recipeGrid.appendChild(card);

  });
}


/* =========================
   OPEN RECIPE
========================= */

function openRecipe(index) {

  const recipe = recipes[index];

  document.getElementById("home").style.display = "none";
  document.getElementById("detail").style.display = "block";

  document.getElementById("detailEmoji").textContent = recipe.emoji;
  document.getElementById("detailTitle").textContent = recipe.name;
  document.getElementById("detailTime").textContent = recipe.time;
  document.getElementById("detailDifficulty").textContent = recipe.difficulty;
  document.getElementById("detailServings").textContent = recipe.servings;

  document.getElementById("detailIngredients").innerHTML =
    recipe.ingredients.map(item => "• " + item).join("<br>");

  document.getElementById("detailSteps").innerHTML =
    recipe.steps.map(step => `<li>${step}</li>`).join("");

  window.scrollTo(0, 0);
}


/* =========================
   BACK TO HOME
========================= */

function showHome() {

  document.getElementById("detail").style.display = "none";
  document.getElementById("home").style.display = "block";

  window.scrollTo(0, 0);
}


/* =========================
   CATEGORY FILTER
========================= */

document.querySelectorAll(".category").forEach(button => {

  button.addEventListener("click", function() {

    document.querySelectorAll(".category")
      .forEach(btn => btn.classList.remove("active"));

    this.classList.add("active");

    const category = this.dataset.category;

    if (category === "All") {
      displayRecipes(recipes);
    } else {
      displayRecipes(
        recipes.filter(recipe => recipe.category === category)
      );
    }

  });

});


/* =========================
   SEARCH
========================= */

document.getElementById("search").addEventListener("input", function() {

  const searchText = this.value.toLowerCase().trim();

  const filtered = recipes.filter(recipe =>
    recipe.name.toLowerCase().includes(searchText) ||
    recipe.category.toLowerCase().includes(searchText)
  );

  displayRecipes(filtered);

});


/* INITIAL LOAD */

displayRecipes(recipes);

</script>

</body>
</html>
